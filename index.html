<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>tasks.</title>
  <meta name="description" content="Speak your tasks and send them to Craft.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1d22" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="tasks.">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#f4f1ea; --card:#fffdf8; --input:#f0ece3; --border:#ddd8cc; --border-light:#e8e3d8;
      --text:#2d2a24; --muted:#7a756a; --dim:#a8a295;
      --accent:#2a7d77; --accent-hover:#1f6560; --accent-soft:#2a7d7714; --accent-text:#1f5f5c; --joint:#3f7a4a; --joint-soft:#3f7a4a14;
      --work:#a0672e; --work-soft:#a0672e14;
      --danger:#b54e4e; --danger-soft:#b54e4e12; --success:#4a7c4a; --success-soft:#4a7c4a14;
      --shadow:0 1px 3px rgba(0,0,0,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#1a1d22; --card:#23272d; --input:#2c3139; --border:#3a4049; --border-light:#434a54;
        --text:#e6e8eb; --muted:#9aa2ad; --dim:#6b737e;
        --accent:#2f8a84; --accent-hover:#3a9a93; --accent-soft:#4fa8a024; --accent-text:#8fd0c9; --joint:#7cc48a; --joint-soft:#7cc48a1f;
        --work:#d99a5b; --work-soft:#d99a5b1f;
        --danger:#c96b6b; --danger-soft:#c96b6b1f; --success:#6bba6b; --success-soft:#6bba6b1f;
        --shadow:0 1px 3px rgba(0,0,0,.3);
      }
    }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:'Source Sans 3',system-ui,sans-serif; font-size:16px; line-height:1.45;
      padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    button, input, textarea, select { font:inherit; color:inherit; }
    button { cursor:pointer; }
    [hidden] { display:none !important; }
    .wrap { max-width:560px; margin:0 auto; padding:16px 16px 120px; }

    header { display:flex; align-items:center; justify-content:space-between; margin:4px 0 18px; }
    .logo { font-family:'Lora',serif; font-weight:600; font-size:28px; letter-spacing:-.5px; margin:0; }
    .logo span { color:var(--accent); }
    .icon-btn {
      width:40px; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--card);
      display:flex; align-items:center; justify-content:center; color:var(--muted); box-shadow:var(--shadow);
    }
    .icon-btn:active { transform:scale(.96); }

    .dictate {
      width:100%; min-height:104px; resize:vertical; padding:14px 16px; border-radius:14px;
      border:1px solid var(--border); background:var(--card); box-shadow:var(--shadow);
      font-size:17px; line-height:1.5; outline:none;
    }
    .dictate:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .dictate::placeholder { color:var(--dim); }
    .hint { font-size:13px; color:var(--muted); margin:8px 2px 0; }
    .mic-row { display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:14px; }
    .mic {
      display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 18px; border-radius:22px;
      border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent-text);
      font-size:16px; font-weight:600; flex-shrink:0;
    }
    .mic:active { transform:scale(.98); }
    .mic.on { background:var(--danger); border-color:var(--danger); color:#fff; }
    .mic.on svg { animation:mic-pulse 1.1s ease-in-out infinite; }
    @keyframes mic-pulse { 50% { opacity:.35; } }
    .mic-said { font-size:13px; color:var(--muted); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-height:18px; text-align:center; }
    .hint b { font-weight:600; color:var(--text); }

    .section-head { display:flex; justify-content:space-between; align-items:baseline; margin:26px 2px 10px; }
    .section-head h2 { font-family:'Lora',serif; font-weight:500; font-size:18px; margin:0; }
    .link-btn { background:none; border:none; color:var(--muted); font-size:14px; padding:4px 2px; }

    .task {
      background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);
      padding:10px 10px 10px 14px; margin-bottom:8px;
    }
    .task-top { display:flex; align-items:center; gap:6px; }
    .task-text {
      flex:1; min-width:0; border:none; background:none; outline:none; padding:4px 0; font-size:16px;
    }
    .task-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
    .chip {
      position:relative; display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 11px;
      border-radius:15px; border:1px solid var(--border); background:var(--input); font-size:13px; font-weight:600;
      color:var(--muted); white-space:nowrap;
    }
    .chip.space-my { color:var(--accent-text); background:var(--accent-soft); border-color:transparent; }
    .chip.space-work { color:var(--work); background:var(--work-soft); border-color:transparent; }
    .chip.space-todoist { color:var(--joint); background:var(--joint-soft); border-color:transparent; }
    .chip.has-date { color:var(--text); }
    /* The real date input sits invisibly on top so iOS opens its own picker. */
    .chip input[type=date] { position:absolute; inset:0; opacity:0; width:100%; height:100%; border:none; }
    .chip .clear { margin-right:-6px; padding:0 4px; border:none; background:none; color:var(--dim); position:relative; z-index:1; font-size:15px; line-height:1; }
    .remove { border:none; background:none; color:var(--dim); width:32px; height:32px; border-radius:8px; flex-shrink:0; font-size:18px; }
    .remove:active { background:var(--danger-soft); color:var(--danger); }

    .empty { color:var(--dim); font-size:14px; text-align:center; padding:18px 0; }

    /* ── Tasks already in Craft ── */
    .group-label { font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--dim); margin:16px 2px 6px; }
    #craft-head { margin:14px 2px -6px; }
    .fold { margin-top:6px; }
    .fold-head {
      display:flex; align-items:center; gap:8px; width:100%; padding:10px 2px; border:none; background:none;
      font-family:'Lora',serif; font-size:20px; font-weight:600; color:var(--text); letter-spacing:-.3px;
      border-bottom:1px solid var(--border);
    }
    .fold-head .fold-name { display:inline; }
    .fold-head .dot { color:var(--accent); }
    .fold-head .n { font-family:'Source Sans 3',sans-serif; font-size:13px; font-weight:600; color:var(--muted); }
    .fold-head .chev { margin-left:auto; color:var(--muted); transition:transform .2s; }
    .fold.closed .chev { transform:rotate(-90deg); }
    .fold.closed .fold-body { display:none; }
    .fold-body { padding-top:2px; }
    .t-row.locked .tick { opacity:.3; }
    .t-doc { color:var(--muted); }
    .t-doc::before { content:"· "; }
    .space-head {
      display:flex; align-items:center; gap:7px; font-family:'Lora',serif; font-size:16px; font-weight:600;
      margin:18px 2px 2px; padding-bottom:6px; border-bottom:1px solid var(--border);
    }
    .space-head .dot { width:8px; height:8px; border-radius:50%; background:currentColor; }
    .space-head .n { margin-left:auto; font-family:'Source Sans 3',sans-serif; font-size:12px; font-weight:600; color:var(--textDim, var(--muted)); }
    .space-head.work { color:var(--work); }
    .space-head.todoist { color:var(--joint); }
    .space-head.my { color:var(--accent-text); }
    .t-row { display:flex; align-items:flex-start; gap:11px; padding:9px 2px; border-bottom:1px solid var(--border); }
    .t-row:last-child { border-bottom:none; }
    .tick {
      width:24px; height:24px; flex-shrink:0; margin-top:1px; border-radius:50%; border:2px solid var(--border);
      background:none; display:flex; align-items:center; justify-content:center; color:transparent; transition:all .15s;
    }
    .tick:active { transform:scale(.9); }
    .t-row.done .tick { background:var(--accent); border-color:var(--accent); color:#fff; }
    .t-row.done .t-text { text-decoration:line-through; color:var(--dim); }
    .t-body { flex:1; min-width:0; }
    .t-text { font-size:15px; overflow-wrap:anywhere; }
    .t-meta { display:flex; align-items:center; gap:8px; margin-top:2px; font-size:12px; color:var(--muted); }
    .t-space { display:inline-flex; align-items:center; gap:5px; font-weight:600; }
    .t-space .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
    .t-space.work { color:var(--work); }
    .t-space.todoist { color:var(--joint); }
    .t-space.my { color:var(--accent-text); }
    .t-when { position:relative; display:inline-flex; align-items:center; padding:2px 7px; margin:-2px 0; border-radius:9px; background:var(--input); cursor:pointer; }
    .t-when.late { color:var(--danger); font-weight:600; }
    .t-when.none { color:var(--dim); }
    .t-when input[type=date] { position:absolute; inset:0; width:100%; height:100%; opacity:0; border:none; cursor:pointer; }
    .t-date.late { color:var(--danger); font-weight:600; }
    .loading { color:var(--dim); font-size:14px; text-align:center; padding:14px 0; }

    .send-bar {
      position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      background:linear-gradient(to top, var(--bg) 70%, transparent); z-index:10;
    }
    .send-bar .inner { max-width:560px; margin:0 auto; }
    .primary {
      width:100%; height:52px; border:none; border-radius:14px; background:var(--accent); color:#fff;
      font-size:17px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.12);
    }
    .primary:disabled { opacity:.45; box-shadow:none; }
    .primary:not(:disabled):active { background:var(--accent-hover); transform:scale(.99); }

    .toast {
      position:fixed; left:16px; right:16px; top:calc(12px + env(safe-area-inset-top)); max-width:528px; margin:0 auto;
      padding:12px 14px; border-radius:12px; font-size:15px; font-weight:500; box-shadow:0 6px 20px rgba(0,0,0,.15);
      background:var(--card); border:1px solid var(--border); z-index:20;
      transform:translateY(calc(-100% - 40px)); visibility:hidden; transition:transform .25s ease, visibility .25s;
    }
    .toast.show { transform:none; visibility:visible; }
    .toast.ok { border-color:var(--success); color:var(--success); }
    .toast.err { border-color:var(--danger); color:var(--danger); }

    dialog {
      width:min(560px, calc(100% - 24px)); max-height:calc(100% - 24px); border:1px solid var(--border); border-radius:16px;
      background:var(--bg); color:var(--text); padding:0; box-shadow:0 20px 60px rgba(0,0,0,.3);
    }
    dialog::backdrop { background:rgba(0,0,0,.4); }
    .dlg { padding:18px 16px 16px; }
    .dlg h2 { font-family:'Lora',serif; font-weight:600; font-size:21px; margin:0 0 4px; }
    .dlg p.sub { color:var(--muted); font-size:14px; margin:0 0 16px; }
    .space-box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; }
    .space-box h3 { margin:0 0 8px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
    .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
    label.f { display:block; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:8px 0 4px; }
    .field {
      width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--input);
      font-size:15px; outline:none;
    }
    .field:focus { border-color:var(--accent); }
    .row { display:flex; gap:8px; align-items:center; margin-top:10px; }
    .btn {
      height:38px; padding:0 14px; border-radius:9px; border:1px solid var(--border); background:var(--card);
      font-size:14px; font-weight:600;
    }
    .test-result { font-size:13px; color:var(--muted); }
    .note { font-size:12px; color:var(--muted); margin:6px 0 2px; line-height:1.35; }
    .test-result.ok { color:var(--success); }
    .test-result.err { color:var(--danger); }
    .dlg-foot { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
    .dlg-foot .primary { width:auto; height:42px; padding:0 20px; font-size:15px; box-shadow:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="logo">tasks<span>.</span></h1>
      <button class="icon-btn" id="open-settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <textarea id="dictation" class="dictate" rows="5" autocapitalize="sentences"
      placeholder="Speak or type your tasks"></textarea>
    <div class="mic-row" id="mic-row" hidden>
      <button class="mic" id="mic">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
        <span id="mic-label">Start speaking</span>
      </button>
      <span class="mic-said" id="mic-said"></span>
    </div>


    <div class="section-head" id="review-head" hidden>
      <h2 id="review-title">Tasks</h2>
      <button class="link-btn" id="clear" hidden>Clear</button>
    </div>
    <div id="tasks" hidden></div>

    <div class="section-head" id="craft-head">
      <h2 id="craft-title">Tasks</h2>
      <button class="link-btn" id="refresh">Refresh</button>
    </div>
    <div id="craft-tasks"></div>
  </div>

  <div class="send-bar"><div class="inner">
    <button class="primary" id="send" disabled>Add to Craft</button>
  </div></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="settings">
    <form method="dialog" class="dlg" id="settings-form">
      <h2>Craft connections</h2>
      <p class="sub">In Craft, open <b>Imagine</b>, create an API connection for each space, and paste its API URL here. These stay on this phone only.</p>
      <div id="space-fields"></div>
      <label class="f" for="default-space">If you don’t say a space</label>
      <select class="field" id="default-space" style="margin-bottom:14px"></select>
      <div class="dlg-foot">
        <button class="primary" value="save">Done</button>
      </div>
    </form>
  </dialog>

  <!-- The version is bumped on each release so a phone holding the page in
       its cache still fetches the new code. -->
  <script type="module" src="app.js?v=2"></script>
</body>
</html>
