<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>tasks.</title>
  <meta name="description" content="Speak or type your tasks.">
  <meta name="theme-color" content="#F0F4F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1d22" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="tasks.">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="/lifeos/fonts.css">
  <style>html,body{margin:0;height:100%;background:#f4f1ea}@media (prefers-color-scheme:dark){html,body{background:#1a1e1a}}</style>
  <script type="module">
    // One sign-in for every lifeOS app: no verified session, off to /lifeos/signin/.
    // Then the app itself (embed.js), the same code lifeOS runs inside its page.
    import { requireAuth } from "/lifeos/auth.js";
    import { standalone } from "/lifeos/embed.js";
    await requireAuth();
    await standalone(new URL("./embed.js", location.href).href);
  </script>
</head>
<body>
  <script>
    // Opens fast and works with no signal (sw.js keeps the app's files here).
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(err => console.warn("Offline copy:", err));
  </script>
</body>
</html>
