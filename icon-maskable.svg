<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0F0F11"/>
  <!-- Android crops a maskable icon to the central circle, so the design
       sits inside the middle 60% and the corners are plain background. -->
  <g transform="translate(20 20) scale(0.6)">
    <text x="44" y="70" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="66" letter-spacing="-2" fill="#F0F0F4">t</text>
      <circle cx="72" cy="66" r="6" fill="#4FA8A0"/>
  </g>
</svg>
